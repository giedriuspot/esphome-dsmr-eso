packages:
  giedriuspot.base: github://giedriuspot/esphome-dsmr-eso/esp8266.yaml@main
 
sensor:
  - platform: dsmr_eso
    energy_delivered_lux:
      name: Energy Consumed total
      filters:
        - delta: 0.1
    energy_delivered_tariff1:
      name: Energy Consumed Tariff 1
      filters:
        - delta: 0.1
    energy_delivered_tariff2:
      name: Energy Consumed Tariff 2
      filters:
        - delta: 0.1
    energy_delivered_tariff3:
      name: Energy Consumed Tariff 3
      filters:
        - delta: 0.1
    energy_delivered_tariff4:
      name: Energy Consumed Tariff 4
      filters:
        - delta: 0.1
    energy_returned_lux:
      name: Energy Produced total
      filters:
        - delta: 0.1
    power_delivered_l1:
      name: Power Consumed L1
    power_delivered_l2:
      name: Power Consumed L2
    power_delivered_l3:
      name: Power Consumed L3
    voltage_l1:
      name: Voltage L1
      filters:
        - delta: 1
    voltage_l2:
      name: Voltage L2
      filters:
        - delta: 1
    voltage_l3:
      name: Voltage L3
      filters:
        - delta: 1
    current_l1:
      name: Current L1
    current_l2:
      name: Current L2
    current_l3:
      name: Current L3
    electricity_failures:
      name: Electricity Failures
      icon: mdi:alert
    electricity_sags_l1:
      name: Number of voltage sags L1
    electricity_sags_l2:
      name: Number of voltage sags L2
    electricity_sags_l3:
      name: Number of voltage sags L3
    electricity_swells_l1:
      name: Number of voltage swells L1
    electricity_swells_l2:
      name: Number of voltage swells L2
    electricity_swells_l3:
      name: Number of voltage swells L3

    total_imported_energy:
      name: Reactive Energy Consumed 
      device_class: reactive_energy
      state_class: total_increasing
      unit_of_measurement: "kvarh"
      filters:
        - delta: 0.1
    total_exported_energy:
      name: Reactive Energy Produced 
      device_class: reactive_energy
      state_class: total_increasing
      unit_of_measurement: "kvarh"
      filters:
        - delta: 0.1
    power_returned_l1:
      name: Power Produced L1
    power_returned_l2:
      name: Power Produced L2
    power_returned_l3:
      name: Power Produced L3
    reactive_power_delivered_l1:
      name: Reactive Power Consumed L1
      unit_of_measurement: "var"
      accuracy_decimals: 0
      filters:
        - multiply: 1000
        - delta: 50
    reactive_power_delivered_l2:
      name: Reactive Power Consumed L2
      unit_of_measurement: "var"
      accuracy_decimals: 0
      filters:
        - multiply: 1000
        - delta: 50
    reactive_power_delivered_l3:
      name: Reactive Power Consumed L3
      unit_of_measurement: "var"
      accuracy_decimals: 0
      filters:
        - multiply: 1000
        - delta: 50
    reactive_power_returned_l1:
      name: Reactive Power Produced L1
      unit_of_measurement: "var"
      accuracy_decimals: 0
      filters:
        - multiply: 1000
        - delta: 50
    reactive_power_returned_l2:
      name: Reactive Power Produced L2
      unit_of_measurement: "var"
      accuracy_decimals: 0
      filters:
        - multiply: 1000
        - delta: 50
    reactive_power_returned_l3:
      name: Reactive Power Produced L3
      unit_of_measurement: "var"
      accuracy_decimals: 0
      filters:
        - multiply: 1000
        - delta: 50
    frequency:
      name: Frequency
      filters:
        - delta: 0.02
    power_factor:
      name: Power Factor
      filters:
        - multiply: 100
        - delta: 1
    power_factor_l1:
      name: Power Factor L1
      filters:
        - multiply: 100
        - delta: 1
    power_factor_l2:
      name: Power Factor L2
      filters:
        - multiply: 100
        - delta: 1
    power_factor_l3:
      name: Power Factor L3
      filters:
        - multiply: 100
        - delta: 1
    power_delivered:
      name: Power Consumed
      accuracy_decimals: 3
    power_returned:
      name: Power Produced
      accuracy_decimals: 3
    reactive_power_delivered:
      name: Reactive Power Consumed
      unit_of_measurement: "kvar"
      filters:
        - delta: 0.05
    reactive_power_returned:
      name: Reactive Power Produced
      unit_of_measurement: "kvar"
      filters:
        - delta: 0.05

text_sensor:
  - platform: dsmr_eso
    identification:
      name: "DSMR Identification"
    equipment_id:
      name: ${friendly_name} Equipment identifier
    consumer_msg:
      name: ${friendly_name} Consumer Message Text
  - platform: wifi_info
    ip_address:
      name: "SlimmeLezer IP Address"
    ssid:
      name: "SlimmeLezer Wi-Fi SSID"
    bssid:
      name: "SlimmeLezer Wi-Fi BSSID"
